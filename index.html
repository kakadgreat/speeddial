<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Speed Dial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <span class="logo-dot"></span>
        <span>My Speed Dial</span>
      </div>

      <div class="header-actions">
        <button id="quickThemeButton" class="btn-ghost small">
          Theme: <span id="quickThemeLabel">Auto</span>
        </button>

        <button id="quickImportButton" class="btn-ghost small">
          Import JSON
        </button>
        <input type="file" id="quickImportInput" accept="application/json" hidden />

        <button id="settingsButton" class="btn small">
          Settings
        </button>
      </div>
    </header>

    <nav id="groupTabs" class="group-tabs"></nav>

    <main>
      <section id="toolbar" class="toolbar">
        <button id="addGroupButton" class="btn">Add Group</button>
        <button id="addDialButton" class="btn">Add Tile</button>
      </section>

      <section id="dialGrid" class="dial-grid"></section>
    </main>

    <!-- Small generic modal -->
    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <button id="modalCloseButton" class="btn-icon" aria-label="Close">&times;</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settingsBackdrop" class="modal-backdrop hidden">
      <div class="settings-modal">
        <div class="settings-sidebar">
          <h2>Preferences</h2>
          <button class="settings-tab-link active" data-tab="general">General</button>
          <button class="settings-tab-link" data-tab="themes">Themes</button>
          <button class="settings-tab-link" data-tab="groups">Groups</button>
          <button class="settings-tab-link" data-tab="system">System</button>
        </div>

        <div class="settings-content">
          <div class="settings-header">
            <h2 id="settingsTitle">General</h2>
            <button id="settingsCloseButton" class="btn-icon">&times;</button>
          </div>

          <!-- GENERAL TAB -->
          <div id="settingsTabGeneral" class="settings-tab active">
            <section class="settings-section">
              <h3>Theme mode</h3>
              <div class="segmented">
                <button data-mode="auto" class="seg-btn active">Auto</button>
                <button data-mode="light" class="seg-btn">Light</button>
                <button data-mode="dark" class="seg-btn">Dark</button>
              </div>
            </section>

            <section class="settings-section">
              <h3>Layout</h3>

              <div class="field">
                <label>Number of columns</label>
                <input id="columnsSlider" type="range" min="3" max="10" />
                <div class="field-note">
                  <span id="columnsLabel"></span>
                </div>
              </div>

              <div class="field">
                <label>Spacing between tiles</label>
                <input id="spacingSlider" type="range" min="8" max="40" />
                <div class="field-note">
                  <span id="spacingLabel"></span>
                </div>
              </div>

              <div class="field">
                <label>Page width</label>
                <input id="widthSlider" type="range" min="900" max="1600" />
                <div class="field-note">
                  <span id="widthLabel"></span>
                </div>
              </div>

              <div class="toggle-row">
                <label>
                  <input type="checkbox" id="centerVerticallyCheckbox" />
                  Center vertically
                </label>
              </div>

              <div class="toggle-row">
                <label>
                  <input type="checkbox" id="showAddButtonsCheckbox" />
                  Show “Add group / Add tile” buttons
                </label>
              </div>

              <div class="toggle-row">
                <label>
                  <input type="checkbox" id="openInNewTabCheckbox" />
                  Open links in a new tab
                </label>
              </div>
            </section>
          </div>

          <!-- THEMES TAB -->
          <div id="settingsTabThemes" class="settings-tab">
            <section class="settings-section">
              <h3>Background – Light theme</h3>
              <div class="field">
                <label>Background color</label>
                <input type="color" id="lightBgColorInput" />
              </div>
              <div class="field">
                <label>Background image URL</label>
                <input type="url" id="lightBgImageInput" placeholder="https://example.com/image.jpg" />
              </div>
            </section>

            <section class="settings-section">
              <h3>Background – Dark theme</h3>
              <div class="field">
                <label>Background color</label>
                <input type="color" id="darkBgColorInput" />
              </div>
              <div class="field">
                <label>Background image URL</label>
                <input type="url" id="darkBgImageInput" placeholder="https://example.com/image.jpg" />
              </div>
            </section>
          </div>

          <!-- GROUPS TAB -->
          <div id="settingsTabGroups" class="settings-tab">
